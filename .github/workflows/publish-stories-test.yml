name: Publish ads-stories test build to CodeArtifact

# Test builds of @vtex/ads-stories from an open PR, to the internal CodeArtifact
# registry only (never npmjs). Dispatched by the DK `npm-publish-v1` pipeline in
# .vtex/deployment.yaml on PRs that touch packages/ads-stories; DK mints the
# short-lived CodeArtifact token and sends it as CA_TOKEN, so no workflow here
# holds a CodeArtifact write credential.
#
# Each run publishes `<version>-test.<sha>` under the `test` dist-tag, so
# `latest` keeps pointing at the last release.

on:
  workflow_dispatch:
    inputs:
      # `version` and `environment` are DK's fixed payload and are not read here:
      # the dispatch API rejects inputs the workflow doesn't declare.
      version:
        description: "Unread. DK forwards its workflowVersion literal"
        required: false
        type: string
      environment:
        description: "Unread. DK derives it from the version literal"
        required: false
        type: string
      CA_TOKEN:
        description: "CodeArtifact Token"
        required: true
        type: string
      CA_OWNER:
        description: "CodeArtifact Domain Owner"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-stories-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CODEARTIFACT_DOMAIN: main
  CODEARTIFACT_REPOSITORY: internal-npm
  AWS_REGION: us-east-1
  NPM_PACKAGE_NAME: "@vtex/ads-stories"

# Workflow inputs are never interpolated into `run:` scripts with ${{ }}; they
# are passed through step-level `env:` and used as quoted shell variables.
jobs:
  publish-test:
    runs-on: ubuntu-latest
    steps:
      # First step: the dispatched CodeArtifact token is a plain input, not a
      # secret, so it is masked before any step can print it.
      - name: Mask CodeArtifact token
        run: echo "::add-mask::$(jq -r '.inputs.CA_TOKEN' "$GITHUB_EVENT_PATH")"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter "${NPM_PACKAGE_NAME}" build

      - name: Set test version
        working-directory: packages/ads-stories
        run: |
          set -euo pipefail
          BASE_VERSION=$(node -p "require('./package.json').version.split('-')[0]")
          VERSION="${BASE_VERSION}-test.${GITHUB_SHA:0:7}"
          npm version "${VERSION}" --no-git-tag-version
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Configure npm for CodeArtifact
        env:
          CODEARTIFACT_TOKEN: ${{ inputs.CA_TOKEN }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ inputs.CA_OWNER }}
        run: |
          set -euo pipefail

          if [ -z "${CODEARTIFACT_TOKEN:-}" ]; then
            echo "CODEARTIFACT_TOKEN not set"; exit 1
          fi

          CODEARTIFACT_HOST="${CODEARTIFACT_DOMAIN}-${CODEARTIFACT_DOMAIN_OWNER}.d.codeartifact.${AWS_REGION}.amazonaws.com/npm/${CODEARTIFACT_REPOSITORY}/"
          # Both the default and the @vtex scope point at CodeArtifact, so the
          # publish below can't fall through to npmjs.
          npm config set registry "https://${CODEARTIFACT_HOST}"
          npm config set "@vtex:registry" "https://${CODEARTIFACT_HOST}"
          npm config set "//${CODEARTIFACT_HOST}:_authToken" "${CODEARTIFACT_TOKEN}"
          echo "CODEARTIFACT_URL=https://${CODEARTIFACT_HOST}" >> "$GITHUB_ENV"

      - name: Publish to CodeArtifact
        working-directory: packages/ads-stories
        run: |
          set -euo pipefail
          if npm view "${NPM_PACKAGE_NAME}@${VERSION}" version --registry "${CODEARTIFACT_URL}" > /dev/null 2>&1; then
            echo "${NPM_PACKAGE_NAME}@${VERSION} is already on CodeArtifact, skipping"
          else
            npm publish --registry "${CODEARTIFACT_URL}" --tag test
          fi
          echo "Published ${NPM_PACKAGE_NAME}@${VERSION} to CodeArtifact (dist-tag \`test\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "Install with: \`npm install ${NPM_PACKAGE_NAME}@${VERSION}\` (with @vtex scoped to CodeArtifact)" >> "$GITHUB_STEP_SUMMARY"
