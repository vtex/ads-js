<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VTEX Ads Stories - Dev</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0 auto;
        max-width: 960px;
        padding: 24px 16px;
      }

      section {
        margin-bottom: 32px;
      }

      .themed {
        --vtex-ads-story-radius: 40px;
      }
    </style>
  </head>
  <body>
    <h1>VTEX Ads Stories Playground</h1>
    <p>Source: <strong id="source"></strong></p>

    <section>
      <h2>Default</h2>
      <vtex-ads-story
        publisher-id="playground-publisher"
        session-id="playground-session"
        placement="home_stories"
      ></vtex-ads-story>
    </section>

    <section class="themed">
      <h2>Themed with CSS variables</h2>
      <vtex-ads-story
        publisher-id="playground-publisher"
        session-id="playground-session"
        placement="home_stories"
      ></vtex-ads-story>
    </section>

    <!--
      The ad server is mocked: requests to it get one test Story per Story
      placement. Installed before the element loads, since the source build
      reads fetch when @vtex/ads-core loads.

      Default: loads the source through Vite (reloads on save).
      ?cdn: loads the built standalone script from dist/cdn, the same file
      the CDN serves. Run `pnpm build` first.
    -->
    <script type="module">
      import { mockStory } from "./src/story/story.mock.ts";

      const AD_SERVER = "https://newtail-media.newtail.com.br/v1/rma/";
      // Simulated ad server latency, to see the element while it loads.
      const DELAY_MS = 500;

      const nativeFetch = window.fetch.bind(window);
      window.fetch = async (input, init) => {
        const url = typeof input === "string" ? input : input.url;
        if (!url.startsWith(AD_SERVER)) return nativeFetch(input, init);

        await new Promise((resolve) => setTimeout(resolve, DELAY_MS));

        const { placements } = JSON.parse(init.body);
        const body = { request_id: "playground" };
        for (const [placement, { types }] of Object.entries(placements)) {
          body[placement] = types.includes("story") ? [mockStory] : [];
        }
        return new Response(JSON.stringify(body), {
          headers: { "content-type": "application/json" },
        });
      };

      const useCdn = new URLSearchParams(location.search).has("cdn");
      document.getElementById("source").textContent = useCdn
        ? "dist/cdn/vtex-ads-stories.js"
        : "src/cdn.ts";

      if (useCdn) {
        const script = document.createElement("script");
        script.src = "/dist/cdn/vtex-ads-stories.js";
        document.head.appendChild(script);
      } else {
        import("./src/cdn.ts");
      }
    </script>
  </body>
</html>
