sonar.projectKey=ads-js

# Generated by pnpm — not hand-edited, so code smells reported on it are not actionable.
sonar.exclusions=pnpm-lock.yaml,packages/playground/**

# Each package writes its own coverage/lcov.info (vitest); the glob picks up any package that has one,
# so new packages are covered without touching this file.
sonar.javascript.lcov.reportPaths=packages/*/coverage/lcov.info

# Suppress typescript:S6759 ("Mark the props of the component as read-only")
# This rule enforces Readonly<Props> on all React component props interfaces.
# Disabled project-wide: the team does not enforce this convention and the signal-to-noise
# ratio does not justify the maintenance burden of adding Readonly<> to every interface.
sonar.issue.ignore.multicriteria=readonly-props
sonar.issue.ignore.multicriteria.readonly-props.ruleKey=typescript:S6759
sonar.issue.ignore.multicriteria.readonly-props.resourceKey=**
