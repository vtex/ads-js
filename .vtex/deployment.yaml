- name: ads-js
  referenceId: T8O9XHQS
  build:
    provider: dkcicd
    pipelines:
      - name: node-ci-v2
        parameters:
          nodeVersion: "24-bookworm"
          packageManager: pnpm
          skipInstall: false
          shallowClone: false
          nodeCommands:
            - build
            - test
          sonarExclusions: "pnpm-lock.yaml,packages/playground/**,**/*test*.ts,**/*test*.tsx,**/*test*.js,**/*test*.jsx,**/coverage,node_modules/**"
        when:
          - event: pull_request
            source: branch

      - name: npm-publish-v1
        parameters:
          nodeVersion: "24-bookworm"
          packageManager: pnpm
          skipInstall: false
          contextPath: packages/core
          nodeCommands:
            - build
          publishViaGithubWorkflow: true
          workflowFile: publish-core.yml
          workflowVersion: "{{ ref_name }}"
        when:
          - event: push
            source: tag
            regex: ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$

      - name: npm-publish-v1
        parameters:
          nodeVersion: "24-bookworm"
          packageManager: pnpm
          skipInstall: false
          contextPath: packages/react
          nodeCommands:
            - build
          publishViaGithubWorkflow: true
          workflowFile: publish-react.yml
          workflowVersion: "{{ ref_name }}"
        when:
          - event: push
            source: tag
            regex: ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$

      - name: npm-publish-v1
        parameters:
          nodeVersion: "24-bookworm"
          packageManager: pnpm
          skipInstall: false
          contextPath: packages/ads-stories
          nodeCommands:
            - build
          publishViaGithubWorkflow: true
          workflowFile: publish-stories.yml
          workflowVersion: "{{ ref_name }}"
        when:
          - event: push
            source: tag
            regex: ^v[0-9]+\.[0-9]+\.[0-9]+-ads-stories$
